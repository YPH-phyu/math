<!DOCTYPE html><!-- HTML5 Document Declaration -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20-Line Modern Card</title>
  <style>/* Internal Styles for Layout & Theme */
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0f172a; font-family: system-ui, sans-serif; color: #f8fafc; }
    .card { padding: 2rem; border-radius: 1rem; background: #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; max-width: 320px; }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; color: #38bdf8; }
    p { margin: 0 0 1.5rem; color: #94a3b8; line-height: 1.5; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body><!-- Centered Interactive Card Container -->
  <main class="card">
    <h1>Hello, World!</h1>
    <p>A complete, styled, and interactive webpage built in exactly 20 lines of HTML.</p>
    <button onclick="this.textContent = this.textContent === 'Click Me' ? 'Clicked!' : 'Click Me'">Click Me</button>
  </main></body></html>
